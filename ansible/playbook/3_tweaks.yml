---
- name: Créer un dossier OneDrive dans le répertoire Home de {{ ansible_user }}
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/OneDrive"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'

- name: Créer ou modifier .bashrc pour ajouter un alias rclone au shell de {{ ansible_user }}
  ansible.builtin.lineinfile:
    path: "/home/{{ ansible_user }}/.bashrc"
    line: 'alias onedrive="rclone --vfs-cache-mode writes mount OneDrive: ~/OneDrive &"'
    insertafter: EOF
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'

- name: Vérifier la présence du fichier .bash_aliases
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.bash_aliases"
    state: touch
    mode: '0644'

- name: Ajouter fastfetch à la fin du .bashrc de {{ ansible_user }}
  ansible.builtin.lineinfile:
    path: "/home/{{ ansible_user }}/.bashrc"
    line: 'fastfetch'
    insertafter: EOF
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'

- name: Créer un dossier de cache pour tldr pour l'utilisateur {{ ansible_user }}
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.cache/tldr"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'
